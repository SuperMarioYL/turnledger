name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build wheel + sdist + checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            !dist/checksums.txt
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Optional PyPI trusted publishing — opt-in via the PYPI_PUBLISH repo variable.
  # A fresh repo has no Trusted Publisher registered, so an always-on job would
  # fail the FIRST release with `invalid-publisher`. Set PYPI_PUBLISH=true and
  # register the publisher at https://pypi.org/manage/project/turnledger/settings/publishing/
  # when you actually want to ship to PyPI.
  pypi:
    name: Publish to PyPI (opt-in)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/turnledger
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
