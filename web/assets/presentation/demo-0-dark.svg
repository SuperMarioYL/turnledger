<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" data-palette="56e6c4-6ac1e7-acf6ca-986bd3b07a57" role="img" aria-labelledby="demo-0-dark-title demo-0-dark-desc"><title id="demo-0-dark-title">TurnLedger demo 1</title><desc id="demo-0-dark-desc">Four constructed text chunks A/B/C/D are interrupted at index two. The real text adapter emits ABCD in continuation mode and ABABCD in its explicit restart comparison. A separate turn saves cursor=2 and remaining=CD in SQLite, closes and reopens the store, then restores yielding/resuming history with no pending resume left.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="760" y2="330"><stop stop-color="#56e6c4"/><stop offset=".6" stop-color="#6ac1e7"/><stop offset="1" stop-color="#acf6ca"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e6c4" stop-opacity=".22"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c38" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6c4" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="760" height="330" rx="16" fill="#050c11"/><rect width="760" height="330" rx="16" fill="url(#grid)"/><ellipse cx="478.8" cy="141.9" rx="380.0" ry="230.99999999999997" fill="url(#halo)"/><text x="36" y="44" fill="#95b9be" font-size="13" text-anchor="start" font-weight="400">DEMO / STEP 01</text><text x="36" y="89.0" fill="#eefdf4" font-size="28" text-anchor="start" font-weight="400">Run 1</text><text x="36" y="148.0" fill="#95b9be" font-size="19" text-anchor="start" font-weight="400">Four constructed text chunks A/B/C/D are interrupted at index</text><text x="36" y="174.6" fill="#95b9be" font-size="19" text-anchor="start" font-weight="400">two. The real text adapter emits ABCD in continuation mode and</text><text x="36" y="201.2" fill="#95b9be" font-size="19" text-anchor="start" font-weight="400">ABABCD in its explicit restart comparison. A separate turn…</text><path d="M36 236H724" stroke="#173c38"/><text x="36" y="272.0" fill="#56e6c4" font-size="16" text-anchor="start" font-weight="400">python examples/presentation_demo.py</text></svg>
