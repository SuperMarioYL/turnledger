<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: Agent streaming → TurnLedger suspend → LedgerEntry audit log → resume and continue from cursor">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="200" y1="150" x2="245" y2="150" marker-end="url(#ah-d)"/>
    <line x1="415" y1="150" x2="460" y2="150" marker-end="url(#ah-d)"/>
    <line x1="630" y1="150" x2="675" y2="150" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="150" x2="241" y2="150" stroke="#8985FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="415" y1="150" x2="456" y2="150" stroke="#4DA3FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="630" y1="150" x2="671" y2="150" stroke="#2DC79A" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M200,150 L241,150" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M415,150 L456,150" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M630,150 L671,150" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-size="10" font-weight="500" fill="#A1A1A8" text-anchor="middle">
    <text x="222" y="142">barge-in</text>
    <text x="437" y="142">save</text>
    <text x="652" y="142">resume</text>
  </g>

  <g>
    <rect x="30" y="110" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">Agent turn</text>
    <text x="115" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">streaming</text>

    <rect x="245" y="110" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">TurnLedger</text>
    <text x="330" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">suspend · resume</text>

    <rect x="460" y="110" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="545" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">LedgerEntry</text>
    <text x="545" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">append-only audit</text>

    <rect x="675" y="110" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">continue</text>
    <text x="760" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">from cursor</text>
  </g>

  <g font-size="11" fill="#A1A1A8">
    <text x="30" y="240">turn = save / yield / resume-continue — not abort-and-restart</text>
    <text x="30" y="258">barge-in → suspend(cursor+payload) → yield floor → resume() → continue</text>
  </g>
</svg>
