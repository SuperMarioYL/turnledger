<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" data-palette="56e6c4-6ac1e7-acf6ca-986bd3b07a57" role="img" aria-labelledby="architecture-light-title architecture-light-desc"><title id="architecture-light-title">TurnLedger architecture</title><desc id="architecture-light-desc">Application-owned state, reusable persistence</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="570"><stop stop-color="#30816e"/><stop offset=".6" stop-color="#447b93"/><stop offset="1" stop-color="#577c66"/></linearGradient><radialGradient id="halo"><stop stop-color="#30816e" stop-opacity=".22"/><stop offset="1" stop-color="#f9fefd" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7ed" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#30816e" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="570" rx="16" fill="#f9fefd"/><rect width="1000" height="570" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="245.1" rx="500.0" ry="399.0" fill="url(#halo)"/><text x="44" y="44" fill="#557a80" font-size="13" text-anchor="start" font-weight="400">ARCHITECTURE / DATA FLOW</text><text x="44" y="84.0" fill="#132a2b" font-size="30" text-anchor="start" font-weight="400">Application-owned state, reusable persistence</text><path d="M320 203H360" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 203H360" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><path d="M636 203H676" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M636 203H676" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><path d="M814.0 264V334.0H182.0V372" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M814.0 264V334.0H182.0V372" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><path d="M320 433H360" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 433H360" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><rect x="44" y="142" width="276" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="62" y="173.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">Streaming adapter</text><text x="62" y="225.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Report cursor and</text><text x="62" y="248.8" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">payload</text><rect x="360" y="142" width="276" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="378" y="173.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">TurnLedger</text><text x="378" y="225.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Suspend / resume</text><text x="378" y="248.8" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">lifecycle</text><rect x="676" y="142" width="276" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="694" y="173.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">Store</text><text x="694" y="225.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Memory or SQLite</text><rect x="44" y="372" width="276" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="62" y="403.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">Resumed entry</text><text x="62" y="455.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Return cursor and</text><text x="62" y="478.8" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">payload</text><rect x="360" y="372" width="276" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="378" y="403.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">Application</text><text x="378" y="455.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Continue actual work</text></svg>
