" fill="#132a2b" font-size="25" text-anchor="start" font-weight="400">Resume four known text</text><text x="28" y="119.0" fill="#132a2b" font-size="25" text-anchor="start" font-weight="400">chunks</text><path d="M200 257V290" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="46" y="166.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">01  Emit A and B</text><text x="46" y="218.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Interruption before C</text><path d="M200 412V445" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="46" y="321.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">02  Save cursor 2</text><text x="46" y="373.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Payload keeps remaining CD</text><path d="M200 567V600" fill="none" stroke="#30816e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#577c66" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="46" y="476.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">03  Restore SQLite</text><text x="46" y="528.0" fill="#557a80" font-size="17" text-anchor="start" font-weight="400">Close, reopen and resume</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ed"/><text x="46" y="631.0" fill="#132a2b" font-size="21" text-anchor="start" font-weight="400">04  Continue C and D</text><text x="46" y="683.0" fill="#557a80" font-size="17" text-anchor="start" font-wei