[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "turnledger"
version = "0.2.0"
description = "An interruption-continuation ledger primitive for real-time agents — save/yield/resume-continue instead of drop-and-restart."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "agents",
    "realtime",
    "voice",
    "livekit",
    "barge-in",
    "turn-taking",
    "interruption",
    "ledger",
    "resume",
    "continuity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
livekit = ["livekit-agents>=0.7"]
test = ["pytest>=8.2"]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/turnledger"
Repository = "https://github.com/SuperMarioYL/turnledger"
Documentation = "https://github.com/SuperMarioYL/turnledger#readme"
Issues = "https://github.com/SuperMarioYL/turnledger/issues"
Changelog = "https://github.com/SuperMarioYL/turnledger/blob/main/CHANGELOG.md"

[project.scripts]
turnledger = "turnledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["turnledger"]

[tool.hatch.build.targets.sdist]
include = [
    "turnledger",
    "examples",
    "tests",
    "docs",
    "assets",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "LICENSE",
    "VERSION",
]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
addopts = "-ra -q"
